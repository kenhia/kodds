[project]
name = "kodds"
version = "0.1.0"
description = "Local LLM classifier: prompt + choices -> per-choice probabilities from next-token logits"
authors = [
    { name = "Ken Hiatt", email = "ken.hiatt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "llama-cpp-python>=0.3.35",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
# GPU/weights tests are opt-in: `just check` must stay fast and model-free.
# Run them with `just test-gpu` (needs KODDS_MODEL pointing at a GGUF).
markers = ["gpu: needs a CUDA GPU and downloaded weights (KODDS_MODEL)"]
addopts = "-m 'not gpu'"
